name: Deploy to GitHub Pages

on:
  push:
    # The repository's default branch is currently the feature branch below; once
    # this is merged, `main` alone is enough and the other entry can go.
    branches:
      - main
      - claude/rpg-dice-roller-threejs-q7drvr
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; finish the one in flight, then run the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type errors should fail the deploy, not ship. `npm run build` runs
      # `tsc --noEmit` before vite.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07070a" />
    <meta
      name="description"
      content="A physically simulated RPG dice roller. Real dice models tumble in a leather tray and the number that lands face up is read off the model."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dicer" />
    <title>Dicer</title>
    <!-- Self-hosted, so the app looks the same with no network. -->
    <link rel="preload" href="./fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="loader" class="loader">
      <div class="loader-mark"></div>
      <div class="loader-text">loading dice</div>
    </div>

    <!-- The settled total, flashed over the scene. -->
    <div id="reveal" class="reveal" aria-live="polite">
      <div class="reveal-total" id="reveal-total"></div>
      <div class="reveal-caption" id="reveal-caption"></div>
      <div class="reveal-breakdown" id="reveal-breakdown"></div>
    </div>

    <div id="hint" class="hint">flick to roll</div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <span class="brand-name">Dicer</span>
      </div>
      <button id="sound-toggle" class="icon-button" type="button" aria-pressed="true" title="Sound on">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path class="speaker" d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z" />
          <path class="wave" d="M15.2 9.4a3.6 3.6 0 0 1 0 5.2" />
          <path class="wave wave-far" d="M17.8 6.9a7.2 7.2 0 0 1 0 10.2" />
          <path class="slash" d="M15.5 8.5l5 7" />
        </svg>
        <span class="visually-hidden">Sound</span>
      </button>
    </header>

    <footer class="controls" id="controls">
      <div class="tray-row" id="pool" aria-label="Dice pool"></div>

      <div class="control-row">
        <div class="picker" id="die-picker" role="group" aria-label="Add a die"></div>
        <div class="actions">
          <button id="clear" class="ghost-button" type="button">Clear</button>
          <button id="roll" class="primary-button" type="button">Roll</button>
        </div>
      </div>

      <div class="control-row secondary">
        <div class="swatches" id="swatches" role="group" aria-label="Dice colour"></div>
        <div class="modes" id="modes" role="group" aria-label="How to read the pool"></div>
      </div>
    </footer>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

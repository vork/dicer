<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07070a" />
    <title>Dicer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="loader" class="loader">
      <div class="loader-mark"></div>
      <div class="loader-text">loading dice</div>
    </div>

    <!-- The settled total, flashed over the scene. -->
    <div id="reveal" class="reveal" aria-live="polite">
      <div class="reveal-total" id="reveal-total"></div>
      <div class="reveal-caption" id="reveal-caption"></div>
      <div class="reveal-breakdown" id="reveal-breakdown"></div>
    </div>

    <div id="hint" class="hint">flick to roll</div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <span class="brand-name">Dicer</span>
      </div>
      <button id="sound-toggle" class="icon-button" type="button" aria-pressed="true" title="Toggle sound">
        <span data-on>♪</span>
      </button>
    </header>

    <footer class="controls" id="controls">
      <div class="tray-row" id="pool" aria-label="Dice pool"></div>

      <div class="control-row">
        <div class="picker" id="die-picker" role="group" aria-label="Add a die"></div>
        <div class="actions">
          <button id="clear" class="ghost-button" type="button">Clear</button>
          <button id="roll" class="primary-button" type="button">Roll</button>
        </div>
      </div>

      <div class="control-row secondary">
        <div class="swatches" id="swatches" role="group" aria-label="Dice colour"></div>
        <div class="modes" id="modes" role="group" aria-label="How to read the pool"></div>
      </div>
    </footer>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

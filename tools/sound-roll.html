<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>roll audio</title></head>
  <body>
    <pre id="out">running…</pre>
    <script type="module">
      import * as THREE from 'three';
      import RAPIER from '@dimforge/rapier3d-compat';
      import { loadDiceAssets } from '/src/assets.ts';
      import { DiceWorld } from '/src/physics/dice-world.ts';
      import { DiceAudio } from '/src/audio.ts';

      const RATE = 44100;
      const dt = 1 / 60;

      await RAPIER.init();
      const assets = await loadDiceAssets();
      const world = new DiceWorld(RAPIER, assets, new THREE.MeshBasicMaterial());

      /**
       * Steps a real roll and keeps every contact it produced, with the time it
       * was heard, so the audio can be rendered as the sequence a player gets
       * rather than as isolated hits.
       */
      /** Just the contact stream, for looking at the schedule itself. */
      window.__renderSchedule = async (pool, seconds) => {
        world.setPool(pool);
        const angle = Math.random() * Math.PI * 2;
        world.roll(new THREE.Vector2(Math.cos(angle), Math.sin(angle)), 0.55 + Math.random() * 0.4);
        const schedule = [];
        let elapsed = 0;
        while (elapsed < seconds) {
          const { impacts } = world.step(dt);
          for (const i of impacts || []) schedule.push({ ...i, frame: elapsed });
          elapsed += dt;
        }
        return schedule;
      };

      window.__renderRoll = async (pool, seconds) => {
        world.setPool(pool);
        const angle = Math.random() * Math.PI * 2;
        world.roll(new THREE.Vector2(Math.cos(angle), Math.sin(angle)), 0.55 + Math.random() * 0.4);

        const schedule = [];
        let elapsed = 0;
        while (elapsed < seconds) {
          const { impacts } = world.step(dt);
          for (const i of impacts || []) schedule.push({ ...i, frame: elapsed });
          elapsed += dt;
        }

        const ctx = new OfflineAudioContext(2, Math.ceil(RATE * seconds), RATE);
        Object.defineProperty(ctx, 'state', { get: () => 'running' });
        // An offline context's clock does not move until it renders, so the rate
        // limiter — which measures against the frame's arrival — would see every
        // contact of the whole roll arrive at zero. Feeding it the frame time
        // reproduces what it does live.
        let fakeNow = 0;
        Object.defineProperty(ctx, 'currentTime', { get: () => fakeNow });

        const audio = new DiceAudio();
        const Original = window.AudioContext;
        window.AudioContext = function () { return ctx; };
        audio.resume();
        window.AudioContext = Original;

        for (const c of schedule) {
          fakeNow = c.frame;
          audio.impact(c.strength, c.pan, c.surface, c.radius, c.when);
        }

        const buffer = await ctx.startRendering();
        const l = buffer.getChannelData(0), r = buffer.getChannelData(1);
        const mono = new Float32Array(l.length);
        for (let i = 0; i < l.length; i++) mono[i] = (l[i] + r[i]) / 2;
        return { rate: RATE, samples: Array.from(mono), contacts: schedule.length };
      };
      document.getElementById('out').textContent = 'ready';
      window.__ready = true;
    </script>
  </body>
</html>

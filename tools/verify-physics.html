<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>physics check</title>
  </head>
  <body>
    <pre id="out">running…</pre>
    <script type="module">
      import * as THREE from 'three';
      import RAPIER from '@dimforge/rapier3d-compat';
      import { loadDiceAssets } from '/src/assets.ts';
      import { DiceWorld } from '/src/physics/dice-world.ts';
      import { DIE_SIDES, DIE_TYPES } from '/src/dice/values.ts';
      import { TRAY } from '/src/scene/tray.ts';

      const params = new URLSearchParams(location.search);
      const trials = Number(params.get('trials') || 200);
      // Narrow to one die type when you want a high-count fairness run.
      const only = params.get('only');
      // Roll a pair this many times and test the two dice for independence.
      const pairs = Number(params.get('pairs') || 0);
      const timeoutSeconds = 25;
      const dt = 1 / 60;

      await RAPIER.init();
      const assets = await loadDiceAssets();
      const world = new DiceWorld(RAPIER, assets, new THREE.MeshBasicMaterial());

      const report = [];
      const problems = [];

      function runTrial(pool) {
        world.setPool(pool);
        const angle = Math.random() * Math.PI * 2;
        world.roll(new THREE.Vector2(Math.cos(angle), Math.sin(angle)), Math.random());

        let elapsed = 0;
        while (elapsed < timeoutSeconds) {
          const { justSettled } = world.step(dt);
          elapsed += dt;
          if (justSettled) break;
        }
        const settled = world.allSettled;

        // Every die must have finished inside the tray, sitting on the floor.
        let escaped = false;
        for (const die of world.dice) {
          const t = die.body.translation();
          if (
            Math.abs(t.x) > TRAY.innerWidth / 2 + 0.6 ||
            Math.abs(t.z) > TRAY.innerDepth / 2 + 0.6 ||
            t.y < TRAY.floorY - 0.3 ||
            t.y > TRAY.floorY + TRAY.wallHeight * 2
          ) {
            escaped = true;
          }
        }

        // A die resting flat sits exactly its inradius above the floor. Anything
        // higher is perched on a neighbour or stuck on the wall.
        let perched = false;
        if (pool.length === 1) {
          for (const die of world.dice) {
            const expected = TRAY.floorY + assets.info[die.type].inradius;
            if (Math.abs(die.body.translation().y - expected) > 0.12) perched = true;
          }
        }

        return { settled, escaped, perched, seconds: elapsed, values: world.values().map((v) => v.value) };
      }

      /**
       * Do two dice of the same type in one throw land independently?
       *
       * They are launched from a ring around a shared origin, with a shared base
       * speed and one spawned slightly higher than the other, so a correlation is
       * not unthinkable even though each gets its own uniform random orientation.
       * Three things are checked: how often the pair matches (1/sides if they are
       * independent), the linear correlation between the two values, and whether
       * either slot in the pair is biased on its own.
       */
      function testPairs(type, count) {
        const sides = DIE_SIDES[type];
        const first = new Map();
        const second = new Map();
        let matches = 0;
        let sumA = 0;
        let sumB = 0;
        let sumAB = 0;
        let sumAA = 0;
        let sumBB = 0;

        for (let i = 0; i < count; i++) {
          const { values } = runTrial([type, type]);
          const [a, b] = values;
          if (a === b) matches++;
          first.set(a, (first.get(a) ?? 0) + 1);
          second.set(b, (second.get(b) ?? 0) + 1);
          sumA += a; sumB += b; sumAB += a * b; sumAA += a * a; sumBB += b * b;
        }

        const chiOf = (counts) => {
          const expected = count / sides;
          let chi = 0;
          for (let v = 1; v <= sides; v++) chi += ((counts.get(v) ?? 0) - expected) ** 2 / expected;
          return chi;
        };

        const meanA = sumA / count;
        const meanB = sumB / count;
        const covariance = sumAB / count - meanA * meanB;
        const sdA = Math.sqrt(sumAA / count - meanA * meanA);
        const sdB = Math.sqrt(sumBB / count - meanB * meanB);
        const r = covariance / (sdA * sdB);

        // How far the match rate sits from chance, in standard errors.
        const p = 1 / sides;
        const rate = matches / count;
        const z = (rate - p) / Math.sqrt((p * (1 - p)) / count);
        // Standard error of a correlation that is really zero.
        const rError = 1 / Math.sqrt(count);
        // Standard error of the gap between the two slots' means.
        const meanError = Math.sqrt((sdA * sdA + sdB * sdB) / count);

        report.push(
          `2${type} x${count}: matched ${(rate * 100).toFixed(1)}% vs ${(p * 100).toFixed(1)}% expected (z ${z.toFixed(1)})  ` +
            `r ${r >= 0 ? '+' : ''}${r.toFixed(3)} (se ${rError.toFixed(3)})`,
        );
        report.push(
          `            slot A chi2 ${chiOf(first).toFixed(1)} mean ${meanA.toFixed(2)}  ` +
            `slot B chi2 ${chiOf(second).toFixed(1)} mean ${meanB.toFixed(2)}  ` +
            `gap ${(meanA - meanB).toFixed(2)} (se ${meanError.toFixed(2)})`,
        );

        // Four standard errors: a fair pair trips these about once in 16000 runs.
        if (Math.abs(z) > 4) problems.push(`2${type}: pairs match ${(rate * 100).toFixed(1)}% of the time, chance is ${(p * 100).toFixed(1)}% (z ${z.toFixed(1)})`);
        if (Math.abs(r) > 4 * rError) problems.push(`2${type}: the two values correlate, r ${r.toFixed(3)} against a standard error of ${rError.toFixed(3)}`);
        if (Math.abs(meanA - meanB) > 4 * meanError) problems.push(`2${type}: one slot in the pair averages higher, gap ${(meanA - meanB).toFixed(2)} against a standard error of ${meanError.toFixed(2)}`);
        for (const [slot, counts] of [['A', first], ['B', second]]) {
          const chi = chiOf(counts);
          // df = sides - 1; this threshold is about p = 1e-4.
          const limit = sides - 1 + 5 * Math.sqrt(2 * (sides - 1));
          if (chi > limit) problems.push(`2${type}: slot ${slot} is not uniform, chi2 ${chi.toFixed(1)} against a limit of ${limit.toFixed(1)}`);
        }
      }

      if (pairs) {
        for (const type of only ? [only] : ['d20', 'd6']) testPairs(type, pairs);
        document.getElementById('out').textContent = report.join('\n');
        window.__result = { report, problems };
        window.__done = true;
      }

      // --- single die of each type: settle reliability and value distribution ---
      for (const type of pairs ? [] : DIE_TYPES) {
        if (only && type !== only) continue;
        const counts = new Map();
        let totalSeconds = 0;
        let slowest = 0;
        let unsettled = 0;
        let escapes = 0;
        let perched = 0;

        for (let i = 0; i < trials; i++) {
          const result = runTrial([type]);
          if (!result.settled) unsettled++;
          if (result.escaped) escapes++;
          if (result.perched) perched++;
          totalSeconds += result.seconds;
          slowest = Math.max(slowest, result.seconds);
          for (const value of result.values) counts.set(value, (counts.get(value) ?? 0) + 1);
        }

        const sides = DIE_SIDES[type];
        const observed = [...counts.keys()].sort((a, b) => a - b);
        const expectedCount = trials / sides;
        // Chi-square against a uniform die. Not a strict pass/fail at this sample
        // size, just a check that no face is wildly over- or under-represented.
        let chi = 0;
        for (let v = 1; v <= sides; v++) {
          const seen = counts.get(v) ?? 0;
          chi += ((seen - expectedCount) ** 2) / expectedCount;
        }

        report.push(
          `${type.padEnd(4)} settled ${trials - unsettled}/${trials}  escapes ${escapes}  perched ${perched}  ` +
            `avg ${(totalSeconds / trials).toFixed(2)}s  max ${slowest.toFixed(2)}s  ` +
            `faces seen ${observed.length}/${sides}${expectedCount >= 10 ? '' : '*'}  ` +
            `chi2 ${chi.toFixed(1)} (df ${sides - 1})`,
        );

        if (unsettled) problems.push(`${type}: ${unsettled}/${trials} rolls never settled`);
        if (escapes) problems.push(`${type}: ${escapes}/${trials} rolls ended outside the tray`);
        if (perched) problems.push(`${type}: ${perched}/${trials} rolls did not end flat on the floor`);

        // "Every face came up" is only a fair thing to demand once each face is
        // expected often enough that missing one would be surprising. The chance
        // a given face is skipped is ((s-1)/s)^trials, which for a d20 at 120
        // rolls is still 1 in 24 across the twenty faces — asserting it there
        // would fail on a perfectly fair die. Ten expected hits per face puts
        // that under a tenth of a percent.
        if (expectedCount >= 10 && observed.length !== sides) {
          problems.push(`${type}: only ${observed.length} of ${sides} faces ever came up`);
        }
      }

      // --- a full pool at the UI's cap, the heaviest case for contacts, and
      // deliberately duplicate-heavy since that is how people build a pool ---
      if (!only && !pairs) {
      const pool = ['d6', 'd6', 'd6', 'd6', 'd20', 'd20', 'd4', 'd8', 'd8', 'd10', 'd12', 'd12'];
      let poolUnsettled = 0;
      let poolEscapes = 0;
      let poolSlowest = 0;
      const poolTrials = Math.max(20, Math.floor(trials / 4));
      for (let i = 0; i < poolTrials; i++) {
        const result = runTrial(pool);
        if (!result.settled) poolUnsettled++;
        if (result.escaped) poolEscapes++;
        poolSlowest = Math.max(poolSlowest, result.seconds);
      }
      report.push(
        `pool of ${pool.length}: settled ${poolTrials - poolUnsettled}/${poolTrials}  ` +
          `escapes ${poolEscapes}  max ${poolSlowest.toFixed(2)}s`,
      );
      if (poolUnsettled) problems.push(`mixed pool: ${poolUnsettled}/${poolTrials} rolls never settled`);
      if (poolEscapes) problems.push(`mixed pool: ${poolEscapes}/${poolTrials} rolls ended outside the tray`);
      }

      if (report.some((line) => line.includes('*'))) {
        report.push('* too few rolls per face to demand full coverage; chi-square still applies');
      }

      document.getElementById('out').textContent = report.join('\n');
      window.__result = { report, problems };
      window.__done = true;
    </script>
  </body>
</html>

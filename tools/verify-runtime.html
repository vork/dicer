<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>runtime reading check</title>
  </head>
  <body>
    <pre id="out"></pre>
    <script type="module">
      import * as THREE from 'three';
      import { readDie, readDirectionsFor } from '/src/dice/read.ts';
      import { DIE_TYPES, FACE_VALUES, DIE_SIDES } from '/src/dice/values.ts';
      import { resolveRoll } from '/src/dice/outcome.ts';

      const info = await (await fetch('/dice/faces.json')).json();
      const lines = [];
      const failures = [];
      const UP = new THREE.Vector3(0, 1, 0);

      for (const type of DIE_TYPES) {
        const directions = readDirectionsFor(type, info[type]);
        const seen = new Set();
        let worstMargin = Infinity;

        for (let slot = 0; slot < directions.length; slot++) {
          // Rotate this slot to point straight up, then spin freely about the
          // vertical axis: the reading must be the same from every yaw.
          const align = new THREE.Quaternion().setFromUnitVectors(directions[slot], UP);
          for (let yaw = 0; yaw < 8; yaw++) {
            const spin = new THREE.Quaternion().setFromAxisAngle(UP, (yaw / 8) * Math.PI * 2);
            const q = spin.clone().multiply(align);
            const reading = readDie(type, directions, q);
            if (reading.index !== slot) {
              failures.push(`${type} slot ${slot} yaw ${yaw} read back as slot ${reading.index}`);
            }
            if (Math.abs(reading.dot - 1) > 1e-5) {
              failures.push(`${type} slot ${slot} should read dot 1.0, got ${reading.dot.toFixed(4)}`);
            }
          }

          // Margin: how far the runner-up sits below the winner. A small margin
          // would mean a slight tilt could flip the reading.
          const align2 = new THREE.Quaternion().setFromUnitVectors(directions[slot], UP);
          const dots = directions
            .map((d) => d.clone().applyQuaternion(align2).dot(UP))
            .sort((a, b) => b - a);
          worstMargin = Math.min(worstMargin, dots[0] - dots[1]);

          seen.add(FACE_VALUES[type][slot]);
        }

        const expected = DIE_SIDES[type];
        if (seen.size !== expected) failures.push(`${type} covers ${seen.size} distinct values, expected ${expected}`);

        lines.push(
          `${type.padEnd(4)} ${directions.length} slots, values ${[...seen].sort((a, b) => a - b).join(',')}`,
        );
        lines.push(`      smallest margin to runner-up: ${worstMargin.toFixed(3)}`);
      }

      // --- how a pool collapses to one number ---
      const d = (type, value) => ({ type, value });
      const cases = [
        ['sum of a mixed pool', [d('d20', 7), d('d6', 3), d('d6', 2)], 'sum', { value: 12, keptIndex: -1, keptIndices: [] }],
        ['sum of nothing', [], 'sum', { value: 0, keptIndex: -1, keptIndices: [] }],
        ['advantage keeps the better d20', [d('d20', 4), d('d20', 17)], 'highest', { value: 17, keptIndex: 1, keptIndices: [1] }],
        ['disadvantage keeps the worse d20', [d('d20', 4), d('d20', 17)], 'lowest', { value: 4, keptIndex: 0, keptIndices: [0] }],
        ['a tie counts every matching die', [d('d6', 5), d('d6', 5)], 'highest', { value: 5, keptIndex: 0, keptIndices: [0, 1] }],
        ['a three-way tie counts all of them', [d('d6', 2), d('d6', 2), d('d6', 2)], 'lowest', { value: 2, keptIndex: 0, keptIndices: [0, 1, 2] }],
        ['only the tied dice count', [d('d6', 6), d('d6', 1), d('d6', 6)], 'highest', { value: 6, keptIndex: 0, keptIndices: [0, 2] }],
        ['highest of one die is that die', [d('d8', 3)], 'highest', { value: 3, keptIndex: 0, keptIndices: [0] }],
        ['highest spans mixed types', [d('d6', 6), d('d20', 2)], 'highest', { value: 6, keptIndex: 0, keptIndices: [0] }],
      ];

      for (const [name, rolls, mode, expected] of cases) {
        const outcome = resolveRoll(rolls, mode);
        if (
          outcome.value !== expected.value ||
          outcome.keptIndex !== expected.keptIndex ||
          outcome.keptIndices.join(',') !== expected.keptIndices.join(',')
        ) {
          failures.push(
            `${name}: got value ${outcome.value} keptIndex ${outcome.keptIndex} keptIndices [${outcome.keptIndices}], ` +
              `expected ${expected.value} / ${expected.keptIndex} / [${expected.keptIndices}]`,
          );
        }
      }

      // Natural rolls are judged on the die that actually counted.
      const naturalCases = [
        ['a kept natural 20 is critical', [d('d20', 1), d('d20', 20)], 'highest', true, false],
        ['a dropped natural 20 is not', [d('d20', 1), d('d20', 20)], 'lowest', false, true],
        ['a natural 20 inside a sum is not', [d('d20', 20), d('d6', 3)], 'sum', false, false],
        ['a lone natural 20 is critical', [d('d20', 20)], 'sum', true, false],
        ['a lone natural 1 is a fumble', [d('d20', 1)], 'sum', false, true],
        ['a d6 showing 1 is not a fumble', [d('d6', 1)], 'sum', false, false],
      ];

      for (const [name, rolls, mode, critical, fumble] of naturalCases) {
        const outcome = resolveRoll(rolls, mode);
        if (outcome.critical !== critical || outcome.fumble !== fumble) {
          failures.push(
            `${name}: got critical ${outcome.critical} fumble ${outcome.fumble}, ` +
              `expected ${critical} / ${fumble}`,
          );
        }
      }

      lines.push(`pool resolution: ${cases.length + naturalCases.length} cases checked`);

      document.getElementById('out').textContent = lines.join('\n');
      window.__result = { lines, failures };
      window.__done = true;
    </script>
  </body>
</html>
